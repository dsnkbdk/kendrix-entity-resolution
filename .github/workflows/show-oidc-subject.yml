name: Show OIDC Subject

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show-subject:
    runs-on: ubuntu-latest

    steps:
      - name: Read OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${RESPONSE}" | jq -r '.value')

          TOKEN="${TOKEN}" python3 <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("aud =", claims["aud"])
          print("sub =", claims["sub"])
          PY